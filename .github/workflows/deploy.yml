name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine Base Path
        id: base_path
        run: |
          if [ -f public/CNAME ]; then
            echo "path=" >> $GITHUB_OUTPUT
            echo "Custom domain detected via public/CNAME: setting empty base path."
          else
            echo "path=/Site_Inova_Saude" >> $GITHUB_OUTPUT
            echo "GitHub Pages default URL detected: setting base path to /Site_Inova_Saude."
          fi

      - name: Build with Next.js export
        env:
          BASE_PATH: ${{ steps.base_path.outputs.path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base_path.outputs.path }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://137-131-233-254.sslip.io' }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
