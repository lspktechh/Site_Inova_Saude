<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Institucional -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041B32" />
      <stop offset="60%" stop-color="#072F56" />
      <stop offset="100%" stop-color="#0B4279" />
    </linearGradient>

    <!-- Gradiente da Cruz da Saúde (Esmeralda / Teal vibrante) -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="35%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0B8161" />
    </linearGradient>

    <!-- Gradiente do Pulso ECG (Branco & Ouro Ecohub de Alto Contraste) -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#F8C412" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Sombra profunda para relevo tridimensional -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <!-- Brilho do Pulso -->
    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F8C412" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base: Squircle com borda nobre -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" stroke="#316195" stroke-width="6" stroke-opacity="0.6" />

  <!-- Cruz da Saúde Arredondada (Símbolo de Saúde, Assistência e Cuidado) -->
  <g filter="url(#shadow3d)">
    <!-- Braço Vertical -->
    <rect x="196" y="80" width="120" height="352" rx="42" fill="url(#crossGrad)" />
    <!-- Braço Horizontal -->
    <rect x="80" y="196" width="352" height="120" rx="42" fill="url(#crossGrad)" />
  </g>

  <!-- Linha de Pulso / Batimento Cardíaco (Vitalidade & Tecnologia da Saúde) -->
  <path
    d="M 96 256 L 164 256 L 194 288 L 236 144 L 278 368 L 314 256 L 338 276 L 354 256 L 416 256"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#pulseGlow)"
  />

  <!-- Faísca de Inovação Ecohub (Criatividade, Ideias & Tecnologia) -->
  <g transform="translate(388, 96) scale(0.95)" filter="url(#pulseGlow)">
    <path
      d="M 0 -38 C 0 -13 13 0 38 0 C 13 0 0 13 0 38 C 0 13 -13 0 -38 0 C -13 0 0 -13 0 -38 Z"
      fill="#F8C412"
    />
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
  </g>
</svg>